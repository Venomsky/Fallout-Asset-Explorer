name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FalloutAssetExplorer.sln

      - name: Build Release
        run: dotnet build FalloutAssetExplorer.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test FalloutAssetExplorer.sln -c Release --no-build --no-restore
